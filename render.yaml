services:
  - type: web
    name: credimerge-api
    runtime: node
    rootDir: Backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://credimerge-538h.vercel.app,https://credimerge-xifa.vercel.app,https://credimerge.netlify.app
      - key: ALLOW_DEMO_LOGIN
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: credimerge
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false